
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-campus-energy-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smart-campus-energy-monitor
  template:
    metadata:
      labels:
        app: smart-campus-energy-monitor
    spec:
      containers:
        - name: energy-dashboard
          image: iniyan59/smart-campus-energy-monitor:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: smart-campus-energy-monitor
spec:
  type: NodePort
  selector:
    app: smart-campus-energy-monitor
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30010
